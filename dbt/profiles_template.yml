---
colibri:
  target: dev  # dev é selecionado como o target padrão quando --target não é informado
  outputs:
    dev: &default
      type: duckdb
      path: ../dados/lakehouse_dev.duckdb
      threads: 4  # mantenha baixo para evitar contenção de lock do arquivo duckdb/catálogo em execuções concorrentes de models
      extensions: [httpfs, ducklake]
      secrets:
        - type: s3
          provider: config
          key_id: R2_KEY
          secret: R2_SECRET
          endpoint: <R2_ACCOUNT_ID>.r2.cloudflarestorage.com
          region: auto
          url_style: path
          use_ssl: true
      config_options:
        temp_directory: ../dados/duckdb_tmp
      settings:
        http_timeout: 3600000
        http_retries: 10
        http_retry_wait_ms: 4000
        http_retry_backoff: 2
        preserve_insertion_order: false
      attach:
        - path: ducklake:../meta.ducklake
          alias: lake
          options:
            data_path: s3://colibri-dev/lake/
            # quando o catalogo meta.ducklake é clonado do bucket de produção, o catálogo continua
            # apontando para o data path original (ex. s3://colibri-prod/lake/) ao invés do data path
            # do bucket de desenvolvimento (ex. s3://colibri-dev/lake/).
            # Esse argumento faz com que o caminho informado em `data_path` acima seja adotado forçosamente.
            override_data_path: true
    prod:
      <<: *default
      path: ../dados/lakehouse_prod.duckdb
      attach:
        # a cópia local do catálogo de produção (ducklake:../meta.ducklake) é importante para permitir
        # acessos concorrentes de múltiplos usuários (DuckDB é uma base analítica, não transacional)
        - path: ducklake:../meta.ducklake
          alias: lake
          options:
            data_path: s3://colibri-prod/lake/
