version: 2

models:
  - name: mrt_tradutor_catmat_ncm__mapeamento
    description: >
      Tradutor de CATMAT para NCM: um registro por catmat com o NCM final
      (capítulo/posição/subitem), priorizando classificação humana sobre
      sugestão de IA. Use metodo_de_mapeamento pra saber a origem. Pode não haver
      sugestão nenhuma (colunas de NCM vêm nulas nesse caso), então pra saber se o item está
      de fato classificado é preciso checar se capitulo_ncm/posicao_ncm/subitem_ncm
      não são nulos, não só olhar o método.
    columns:
      - name: catmat
        data_type: varchar
        description: Código CATMAT do item de material. Chave da tabela (um registro por catmat).
      - name: capitulo_ncm
        data_type: varchar
        description: >
          Capítulo NCM (2 dígitos) final do item, priorizando o mapeamento
          humano quando existir; cai pra sugestão da IA caso contrário.
      - name: posicao_ncm
        data_type: varchar
        description: >
          Posição NCM (4 dígitos) final do item. Fica nula se o mapeamento
          humano existir mas não tiver esse nível de detalhe registrado. Nesse
          caso não é completada com o dado da IA, pra não misturar as duas fontes
          na mesma linha.
      - name: subitem_ncm
        data_type: varchar
        description: >
          Subitem NCM (código completo de 8 dígitos) final do item. Fica nulo
          se o mapeamento humano não tiver esse nível de detalhe, ou se a IA
          não tiver sugerido nada pra esse item.
      - name: metodo_de_mapeamento
        data_type: varchar
        description: >
          Origem da classificação: "humano" quando existe um código NCM
          atribuído manualmente pra esse catmat, ou "ia" quando não existe e a
          sugestão do modelo foi usada no lugar. Sempre que houver um
          mapeamento humano e um de IA pro mesmo catmat, o humano é priorizado.
