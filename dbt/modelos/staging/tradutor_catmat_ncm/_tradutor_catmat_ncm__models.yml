version: 2

models:
  - name: stg_tradutor_catmat_ncm__mapeamento_ia
    description: >
      Carga bruta da planilha "Catálogo de Materiais - parcial.xlsx"
      (bucket colibri-arquivos), com o mapeamento de itens CATMAT para NCM
      sugerido por um encoder, além do mapeamento humano já registrado
      quando existente.
    columns:
      - name: codigo_do_grupo
        data_type: varchar
        description: Código do grupo de materiais do CATMAT ao qual o item pertence.
      - name: nome_do_grupo
        data_type: varchar
        description: Nome do grupo de materiais.
      - name: codigo_da_classe
        data_type: varchar
        description: Código da classe de materiais do CATMAT (subdivisão do grupo).
      - name: nome_da_classe
        data_type: varchar
        description: Nome da classe de materiais.
      - name: codigo_do_pdm
        data_type: varchar
        description: Código do PDM (Padrão Descritivo de Material) do item.
      - name: nome_do_pdm
        data_type: varchar
        description: Nome do PDM (Padrão Descritivo de Material).
      - name: codigo_do_item
        data_type: varchar
        description: Código CATMAT do item de material.
      - name: descricao_do_item
        data_type: varchar
        description: Descrição textual completa do item de material no CATMAT.
      - name: codigo_ncm
        data_type: varchar
        description: >
          Código NCM atribuído manualmente por uma pessoa (mapeamento humano).
          Vem como "-" na planilha original quando ainda não há classificação
          humana. Pode ter de 2 a 8 dígitos, dependendo do nível de precisão
          que a pessoa registrou (capítulo, posição ou subitem completo); nem
          sempre é o código completo de 8 dígitos.
      - name: capitulo_ncm_sugerido
        data_type: varchar
        description: Capítulo NCM (2 dígitos) sugerido pelo modelo de IA para o item.
      - name: descricao_do_capitulo_sugerido
        data_type: varchar
        description: Descrição do capítulo NCM sugerido pela IA.
      - name: posicao_ncm_sugerida
        data_type: varchar
        description: Posição NCM (4 dígitos) sugerida pelo modelo de IA.
      - name: descricao_da_posicao_sugerida
        data_type: varchar
        description: Descrição da posição NCM sugerida pela IA.
      - name: ncm_sugerido_top_5
        data_type: varchar
        description: >
          Até 5 códigos de subitem NCM (8 dígitos) sugeridos pela IA, em ordem
          de confiança, separados por vírgula (ex. "87085099,87085080,87085091").
          O primeiro da lista é o mais provável.
      - name: descricao_do_ncm_sugerido_top_5
        data_type: varchar
        description: >
          Descrição de cada NCM sugerido no top 5, na mesma ordem, separadas por " | ".
