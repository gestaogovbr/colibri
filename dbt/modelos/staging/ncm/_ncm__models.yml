---
version: 2
models:
  - name: stg_ncm
    description: >
      Nomenclatura Comum do Mercosul (NCM) enriquecida com hierarquia,
      acumulada por versão (incremental append). Cada arquivo CSV gerado por
      ingestion/ncm/extract.py corresponde a uma versão do NCM baixada
      da API do Siscomex. Histórico de versões preservado via _source_file.
    columns:
      - name: codigo
        description: Código NCM (pode conter pontos, ex. "01.06.32.00").
      - name: descricao
        description: Descrição do código NCM.
      - name: nivel
        description: Nível hierárquico (Capítulo, Posição, Subposição 1/2, Item, Subitem).
      - name: caminho
        description: Caminho completo da hierarquia do código até o nó atual.
      - name: _source_file
        description: Caminho do arquivo CSV de origem (inclui timestamp da versão).
  - name: int_ncm
    description: >
      Versão mais recente de cada código NCM, deduplicada a partir de
      stg_ncm. Atualizada integralmente a cada nova versão do NCM.
    columns:
      - name: codigo
        description: Código NCM.
      - name: nivel
        description: Nível hierárquico (Capítulo, Posição, Subposição 1/2, Item, Subitem).
      - name: capitulo_codigo
        description: Código do capítulo ancestral do item.
  - name: int_ncm_prefixos
    description: >
      Tabela de lookup prefixo→subitem: para cada código de prefixo NCM
      (capítulo 2 dígitos, posição 4, subposição 5/6, item 7), lista todos
      os subitens (8 dígitos) que pertencem a ele. Derivada de int_ncm via
      self-joins por prefixo de código (sem pontos).
    columns:
      - name: prefixo
        description: Código do nó ancestral (sem pontos).
      - name: codigo
        description: Código do subitem (8 dígitos, sem pontos).
      - name: nivel
        description: Nível do subitem (sempre "Subitem").
      - name: capitulo_codigo
        description: Código do capítulo ancestral do subitem.
